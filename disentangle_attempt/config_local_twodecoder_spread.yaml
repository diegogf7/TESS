# Isolated learned two-decoder experiment.  The original 320/40/40 anchor TIC
# membership is fixed; the supplemental catalog contributes peer candidates only.
run_name: local_s1_c4_ccd2_twodecoder_p64_i4_spread
seed: 42
curve_length: 1024
anchors_per_step: 32
n_peers: 8
n_tokens: 32
token_dim: 16
hidden_fraction: 0.25
mask_style: contiguous_windows

sector: 1
camera: 4
ccd: 2
max_eligible_anchors: 400
expected_anchor_split_counts:
  train: 320
  val: 40
  test: 40
min_valid_fraction: 0.5
min_chip_anchors: 64
parquet: disentangle_attempt/data/cross_sector_raw.parquet
supplemental_parquet: disentangle_attempt/outputs/local_s1_c4_ccd2_twodecoder_p64_i4_spread/peer_data/peer_only_s1_c4_ccd2.parquet
reference_split_tics: disentangle_attempt/outputs/local_s1_c4_ccd2_12px_p128_i32/split_tics.json

# Slots 1--4 are in the half-open inner band; slots 5--8 are in the inclusive
# outer band.  The selector may relax only the global peer-to-peer spacing in the
# listed order before expanding only the outer upper boundary.
peer_selection: spread_two_band
peer_distance_bands_px:
  - [128.0, 384.0]
  - [384.0, 768.0]
peer_distance_band_upper_inclusive: [false, true]
peers_per_distance_band: 4
minimum_peer_separation_tiers_px: [256.0, 192.0, 128.0]
outer_expansion_radii_px: [1024.0, 1536.0, 2048.0, 3072.0]
prefer_angular_coverage: true
deterministic_farthest_point: true

physics_latent_dim: 64
instrument_token_dim: 4
instrument_context_dim: 32
d_model: 128
n_layers: 4
dropout: 0.0

max_train_steps_per_epoch: 40
max_epochs: 30
early_stopping_patience: 5
max_runtime_minutes: 45

optimizer: adamw
learning_rate: 0.0003
weight_decay: 0.0001
scheduler: constant
gradient_clip: 1.0
mixed_precision: true
num_workers: 0
device: auto

# Fixed-mask eight-anchor gate.  A fresh model is used and discarded before the
# full seed-42 model is initialized.
tiny_overfit_anchors: 8
tiny_overfit_max_steps: 160
tiny_overfit_min_steps: 30
tiny_overfit_target_ratio: 0.60

# Evaluation-only collapse diagnostics; these never enter the objective.
collapse_rms_threshold: 0.00001
collapse_variation_threshold: 0.00001
collapse_patience_epochs: 3
complementary_mask_count: 4
complementary_mask_block: 64
heldout_plot_count: 12

save_reference_context: false
refuse_existing_training_artifacts: true
